<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Especial</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background-color: #0f0f0f; 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container { 
      width: 100%; 
      max-width: 480px; 
      background-color: #000;
      min-height: 100vh;
      padding-bottom: 40px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    img, video { 
      width: 100%; 
      height: auto; 
      display: block; 
    }
    .botoes-wrapper { 
      padding: 24px 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }
    .btn { 
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px; 
      color: #ffffff; 
      text-decoration: none; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 16px;
      text-align: center;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-wsp { background-color: #25D366; }
    .btn-mapa { background-color: #1a73e8; }
    .btn-pix { background-color: #00bdae; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Vídeo ou Animação de Abertura -->
    <video playsinline autoplay loop muted poster="capa.jpg">
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Áudio de Fundo -->
    <audio id="musica" loop autoplay src="musica.mp3"></audio>

    <!-- Páginas/Artes do Convite -->
    <img src="pagina1.jpg" alt="Detalhes do Evento">
    <img src="pagina2.jpg" alt="Informações Adicionais">

    <!-- Botões Interativos -->
    <div class="botoes-wrapper">
      <!-- Substitua o número 5519999999999 pelo seu WhatsApp com DDD -->
      <a class="btn btn-wsp" href="https://wa.me/5519999999999?text=Ol%C3%A1!%20Confirmo%20minha%20presen%C3%A7a%20na%20festa!" target="_blank">
        Confirmar Presença (WhatsApp)
      </a>

      <!-- Cole aqui o link do Google Maps do local -->
      <a class="btn btn-mapa" href="https://maps.google.com" target="_blank">
        Como Chegar (Google Maps)
      </a>
    </div>
  </div>

</body>
</html>
