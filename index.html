<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Arca do Ravi - Convite 1 Aninho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f0f0f;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      min-height: 100vh;
    }

    /* TELA DE CAPA (A imagem da carta) */
    .capa-wrapper {
      position: absolute;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: url('capa-ravi-convite.jpg') no-repeat center top / cover;
      z-index: 10;
      transition: opacity 0.8s ease, visibility 0.8s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ÁREA CLICÁVEL INVISÍVEL SOBRE O ENVELOPE DA IMAGEM */
    .area-envelope-clicavel {
      width: 80%;
      height: 28%;
      margin-top: 10%; /* Ajuste fino de posição para cobrir exatamente o envelope */
      cursor: pointer;
      border-radius: 12px;
      /* Destaque sutil e pulsante para incentivar o clique */
      animation: pulso 2s infinite;
    }

    @keyframes pulso {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* CONTEÚDO REVELADO APÓS CLICAR NO ENVELOPE */
    .conteudo-convite {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      padding-bottom: 40px;
      background-color: #fdfbf7;
      min-height: 100vh;
    }
    .conteudo-convite.ativo {
      display: block;
      opacity: 1;
    }

    video, img { width: 100%; height: auto; display: block; }
    
    /* BOTÕES FINAIS (WHATSAPP E MAPA) */
    .botoes-acao {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .btn-link:active { transform: scale(0.98); }
    .btn-wsp { background-color: #25D366; }
    .btn-mapa { background-color: #1a73e8; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Tela Inicial de Capa -->
    <div class="capa-wrapper" id="capaWrapper">
      <!-- Esta div transparente fica exatamente por cima da carta/envelope na imagem -->
      <div class="area-envelope-clicavel" onclick="abrirConvite()" title="Clique para abrir"></div>
    </div>

    <!-- Conteúdo Interno que abre quando clica -->
    <div class="conteudo-convite" id="conteudoConvite">
      
      <!-- Vídeo Animado (se tiver) ou Imagem Interna do Convite -->
      <video id="videoConvite" playsinline loop muted poster="capa-ravi-convite.jpg">
        <source src="video.mp4" type="video/mp4">
      </video>

      <!-- Áudio de Fundo -->
      <audio id="musicaFundo" loop src="musica.mp3"></audio>

      <!-- Botões de Ação -->
      <div class="botoes-acao">
        <!-- Coloque seu número do WhatsApp com DDD abaixo -->
        <a class="btn-link btn-wsp" href="https://wa.me/5519999999999?text=Ol%C3%A1!%20Confirmo%20presen%C3%A7a%20no%20anivers%C3%A1rio%20do%20Ravi!" target="_blank">
          Confirmar Presença (WhatsApp)
        </a>
        
        <!-- Cole o link do Google Maps da festa abaixo -->
        <a class="btn-link btn-mapa" href="https://maps.google.com" target="_blank">
          Como Chegar (Google Maps)
        </a>
      </div>

    </div>

  </div>

  <script>
    function abrirConvite() {
      const capa = document.getElementById('capaWrapper');
      const conteudo = document.getElementById('conteudoConvite');
      const musica = document.getElementById('musicaFundo');
      const video = document.getElementById('videoConvite');

      // Animação de fade-out da capa
      capa.style.opacity = '0';
      
      setTimeout(() => {
        capa.style.display = 'none';
        conteudo.classList.add('ativo');
        
        // Toca o áudio e o vídeo automaticamente
        if(musica) musica.play().catch(() => {});
        if(video) video.play().catch(() => {});
      }, 800);
    }
  </script>

</body>
</html>
