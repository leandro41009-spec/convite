<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Arca do Ravi - Convite 1 Aninho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f0f0f;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      min-height: 100vh;
    }

    /* TELA DE CAPA (A imagem da carta) */
    .capa-wrapper {
      position: absolute;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: url('capa-ravi-convite.jpg') no-repeat center top / cover;
      z-index: 10;
      transition: opacity 0.8s ease, visibility 0.8s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ÁREA CLICÁVEL INVISÍVEL SOBRE O ENVELOPE */
    .area-envelope-clicavel {
      width: 80%;
      height: 28%;
      margin-top: 10%;
      cursor: pointer;
      border-radius: 12px;
      animation: pulso 2s infinite;
    }

    @keyframes pulso {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* CONTEÚDO REVELADO APÓS CLICAR NO ENVELOPE */
    .conteudo-convite {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
      padding-bottom: 40px;
      background-color: #fdfbf7;
      min-height: 100vh;
    }
    .conteudo-convite.ativo {
      display: block;
      opacity: 1;
    }

    video { width: 100%; height: auto; display: block; }
    
    /* BOTÕES FINAIS */
    .botoes-acao {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .btn-link:active { transform: scale(0.98); }
    .btn-wsp { background-color: #25D366; }
    .btn-mapa { background-color: #1a73e8; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="capa-wrapper" id="capaWrapper">
      <div class="area-envelope-clicavel" onclick="abrirConvite()" title="Clique para abrir"></div>
    </div>

    <div class="conteudo-convite" id="conteudoConvite">
      
      <video id="videoConvite" playsinline loop poster="capa-ravi-convite.jpg">
        <source src="convite-ravi (1).mp4" type="video/mp4">
      </video>

      <div class="botoes-acao">
        <a class="btn-link btn-wsp" href="https://wa.me/5519983348474?text=Ol%C3%A1!%20Confirmo%20presen%C3%A7a%20no%20anivers%C3%A1rio%20do%20Ravi!" target="_blank">
          Confirmar Presença (WhatsApp)
        </a>
        
        <a class="btn-link btn-mapa" href="https://www.google.com/maps/place/R.+das+Goiabeiras,+113+-+Res.+Vale+das+Nogueiras,+Americana+-+SP,+13474-381/@-22.7070184,-47.2852298,17z/data=!3m1!4b1!4m6!3m5!1s0x94c8909b21261819:0xe3b0c555995f9402!8m2!3d-22.7070184!4d-47.2852298!16s%2Fg%2F11gcz1fvd8?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D" target="_blank">
          Como Chegar (Google Maps)
        </a>
      </div>

    </div>

  </div>

  <script>
    function abrirConvite() {
      const capa = document.getElementById('capaWrapper');
      const conteudo = document.getElementById('conteudoConvite');
      const video = document.getElementById('videoConvite');

      capa.style.opacity = '0';
      
      setTimeout(() => {
        capa.style.display = 'none';
        conteudo.classList.add('ativo');
        
        if(video) {
          video.currentTime = 0;
          video.play().catch(() => {});
        }
      }, 800);
    }
  </script>

</body>
</html>
