<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1º Aniversário do Ravi Zoz Auad</title>

  <!-- Prévia para compartilhamento no WhatsApp -->
  <meta property="og:title" content="1º Aniversário do Ravi Zoz Auad 🎈" />
  <meta property="og:description" content="Clique para abrir o convite especial de 1 aninho do Ravi!" />
  <meta property="og:image" content="https://convite-lovat-zeta.vercel.app/capa-ravi-convite.jpg" />
  <meta property="og:url" content="https://convite-lovat-zeta.vercel.app/" />
  <meta property="og:type" content="website" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: #fdfbf7;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }

    /* TELA DE CAPA (A imagem da Galinha Pintadinha com o Ravi) */
    .capa-wrapper {
      position: absolute;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: url('capa-ravi-convite.jpg') no-repeat center center / cover;
      z-index: 10;
      transition: opacity 0.8s ease, visibility 0.8s;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 12%; /* Alinha a área clicável ao botão da imagem */
    }

    /* ÁREA CLICÁVEL TRANSPARENTE SOBRE O BOTÃO DESENHADO */
    .botao-transparente-clicavel {
      width: 82%;
      height: 14%;
      cursor: pointer;
      border-radius: 35px;
      animation: pulso-suave 1.8s infinite;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulso-suave {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* CONTEÚDO REVELADO APÓS O CLIQUE (VÍDEO + BOTÕES) */
    .conteudo-convite {
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 20px 16px;
    }

    .conteudo-convite.ativo {
      display: flex;
      opacity: 1;
    }

    /* VÍDEO ANIMADO DO RAVI */
    .video-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    /* BOTÕES FINAIS (WHATSAPP E MAPS) */
    .botoes-acao {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 10px;
      flex-shrink: 0;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn-link:active { transform: scale(0.98); }
    .btn-wsp { background-color: #25D366; }
    .btn-mapa { background-color: #1a73e8; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Capa com área invisível sobre o botão "CLIQUE AQUI PARA ABRIR O CONVITE" -->
    <div class="capa-wrapper" id="capaWrapper">
      <div class="botao-transparente-clicavel" onclick="abrirConvite()" title="Clique para abrir o convite"></div>
    </div>

    <!-- Conteúdo do Convite -->
    <div class="conteudo-convite" id="conteudoConvite">
      
      <!-- Vídeo Animado "video-convite-ravi.mp4" -->
      <div class="video-container">
        <video id="videoConvite" playsinline loop poster="capa-ravi-convite.jpg">
          <source src="video-convite-ravi.mp4" type="video/mp4">
        </video>
      </div>

      <!-- Botões de Ação -->
      <div class="botoes-acao">
        <a class="btn-link btn-wsp" href="https://wa.me/5519983348474?text=Ol%C3%A1!%20Confirmo%20presen%C3%A7a%20no%20anivers%C3%A1rio%20do%20Ravi!" target="_blank">
          Confirmar Presença (WhatsApp)
        </a>
        
        <a class="btn-link btn-mapa" href="https://www.google.com/maps/place/R.+das+Goiabeiras,+113+-+Res.+Vale+das+Nogueiras,+Americana+-+SP,+13474-381/@-22.7070184,-47.2852298,17z/data=!3m1!4b1!4m6!3m5!1s0x94c8909b21261819:0xe3b0c555995f9402!8m2!3d-22.7070184!4d-47.2852298!16s%2Fg%2F11gcz1fvd8?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D" target="_blank">
          Como Chegar (Google Maps)
        </a>
      </div>

    </div>

  </div>

  <script>
    function abrirConvite() {
      const capa = document.getElementById('capaWrapper');
      const conteudo = document.getElementById('conteudoConvite');
      const video = document.getElementById('videoConvite');

      capa.style.opacity = '0';
      
      setTimeout(() => {
        capa.style.display = 'none';
        conteudo.classList.add('ativo');
        
        if(video) {
          video.currentTime = 0;
          video.play().catch(() => {});
        }
      }, 800);
    }
  </script>

</body>
</html>
